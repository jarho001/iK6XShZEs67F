# RTX 6000 candidate (Phase 4, task 3): configs/rtx3060ti.toml with 16,384 battle rows per update
# instead of 1,024. Nothing else changes (the batch size is the only size that differs), so the lab's
# per-GPU runs are the same training with more rows. The batch is the part 1 choice (see
# work/codex/runs/p4t3a-final.md): the largest power of two whose estimated peak memory stays at or
# under half the 40.2 GiB the RTX 6000 gives JAX. The features add activations per row, so the
# estimate is a little higher than part 1's; the lab's probe and fallback decide what fits. The lab
# sets the update count from its time budget; run.updates here is the 3060 Ti's.
# Run it with `python -m pokejax.train --config configs/rtx6000.toml`.

[run]
name = "rtx6000"
seed = 0
updates = 4000

[opponent]
shares = { selfplay = 0.375, pool = 0.25, random = 0.0625, random-move = 0.0625, max-damage = 0.125, heuristics = 0.125 }

[pool]
size = 8
every = 50

[rollout]
batch_size = 16384
rollout_length = 64
sequence_length = 16

[env]
max_steps = 1000
shaping = false
shaping_coef = 0.1

[network]
core = "gru"
activation = "relu"
core_width = 256
trunk_width = 256
member_width = 64
species_embedding = 32
move_embedding = 16
item_embedding = 8
ability_embedding = 8
type_embedding = 8
code_embedding = 4
features = true
action_head = "factored"
action_width = 64

[ppo]
epochs = 4
minibatches = 4
learning_rate = 1e-3
learning_rate_end = 1e-4
lr_schedule = "linear"
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
value_clip = 0.2
value_coef = 0.5
entropy_coef = 0.01
max_grad_norm = 0.5
adam_eps = 1e-5

[logging]
every = 10

[evaluation]
every = 250
battles = 1024
final_battles = 4096
batch = 1024
opponents = ["random", "random-move", "max-damage", "heuristics"]
greedy = true

[checkpoint]
every = 250
