# The default run: a recurrent maskable PPO against the random policy, sized for the RTX 3060 Ti.
# Run it with `python -m pokejax.train`; any value can be changed with a flag or --set.

[run]
name = "default"
seed = 0
updates = 600

[opponent]
baseline = "random"

[rollout]
batch_size = 1024
rollout_length = 64
sequence_length = 16

[env]
max_steps = 1000
shaping = false
shaping_coef = 0.1

[network]
core = "gru"
activation = "relu"
core_width = 256
trunk_width = 256
member_width = 64
species_embedding = 32
move_embedding = 16
item_embedding = 8
ability_embedding = 8
type_embedding = 8
code_embedding = 4

[ppo]
epochs = 4
minibatches = 4
learning_rate = 3e-4
learning_rate_end = 3e-5
lr_schedule = "linear"
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
value_clip = 0.2
value_coef = 0.5
entropy_coef = 0.01
max_grad_norm = 0.5
adam_eps = 1e-5

[logging]
every = 10

[evaluation]
every = 50
battles = 1024
final_battles = 4096
batch = 512

[checkpoint]
every = 100
